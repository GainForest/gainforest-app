<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GainForest OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  /* Match the page tokens (app/globals.css) so the OG sits inside
     the same visual language as the site. */
  :root {
    --background: #f4efe4;
    --foreground: #1c1c1a;
    --primary: #3e7053;
    --brand: #2fce8a;
    --border-soft: #e6dfd0;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* OG canvas — fixed at 1200×630 so headless Chrome with
     --window-size=1200,630 captures exactly this frame. */
  .og {
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 690px 510px;
    background: var(--background);
    font-family: "Inter", system-ui, sans-serif;
    color: var(--foreground);
    position: relative;
    overflow: hidden;
  }

  /* LEFT — copy block, matches the live Hero. */
  .left {
    padding: 56px 56px 56px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--foreground);
  }
  .brand .mark {
    width: 44px;
    height: 44px;
    /* The logo SVG uses currentColor in the wrapper, but here we render the
       real mark in its brand mint. The CSS mask is overkill for a static
       OG — embed the file URL via background-image. */
    background-image: url("file://__PUBLIC__/decor/gainforest-logo.svg");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  .brand .wordmark {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.005em;
  }

  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    font-size: 76px;
    line-height: 1.04;
    letter-spacing: -0.015em;
    margin: 0;
    color: var(--foreground);
  }
  h1 .italic {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
  }

  /* Curved hand-drawn brush stroke — identical to Hero.tsx
     (BRUSH_PATH, BRUSH_VIEWBOX, stroke-width). The sweep stretches
     to fit the brushed word via preserveAspectRatio="none". */
  .brushed {
    position: relative;
    display: inline-block;
  }
  .brushed-word { position: relative; z-index: 1; }
  .brushed svg {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -8px;
    height: 16px;
    width: 100%;
    overflow: visible;
    color: var(--primary);
    z-index: 0;
    pointer-events: none;
  }

  .subtitle {
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.5;
    color: rgba(28, 28, 26, 0.85);
    max-width: 540px;
    margin-top: 24px;
  }

  .footer-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 18px;
    color: rgba(28, 28, 26, 0.55);
    letter-spacing: 0.005em;
  }
  .footer-row::before {
    content: "";
    flex: 0 0 36px;
    height: 1px;
    background: rgba(28, 28, 26, 0.25);
  }

  /* RIGHT — full-bleed real photograph. The seam is feathered with a
     small cream-to-transparent gradient on the left edge so the photo
     reads as part of the cream surface, not a pasted-in rectangle. */
  .right {
    position: relative;
    width: 510px;
    height: 630px;
    overflow: hidden;
    background: #0b1814;
  }
  .right .photo {
    position: absolute;
    inset: 0;
    background-image: url("file://__PUBLIC__/data-commons/community-mangrove.webp");
    background-size: cover;
    background-position: 60% center;
    filter: saturate(1.04) contrast(1.04);
  }
  /* Hairline feather so the seam between cream + photo is invisible
     without eating into the leftmost figure. Just a 14 px gradient. */
  .right .feather {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      var(--background) 0%,
      rgba(244, 239, 228, 0.0) 14px,
      rgba(244, 239, 228, 0.0) 100%
    );
    pointer-events: none;
  }
  /* Subtle bottom-left vignette so the headline side stays the
     visual anchor without dimming the people in the photo. */
  .right .vignette {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        to right,
        rgba(0, 0, 0, 0.10) 0%,
        rgba(0, 0, 0, 0.0) 18%,
        rgba(0, 0, 0, 0.0) 100%
      );
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="og">
    <div class="left">
      <div class="brand">
        <div class="mark"></div>
        <div class="wordmark">GainForest</div>
      </div>

      <div>
        <h1>
          <span class="brushed">
            <span class="brushed-word">Open</span>
            <svg viewBox="0 0 178 16" preserveAspectRatio="none" aria-hidden="true">
              <path d="M 3 10.5 C 44 6.5 87 6 175 8.5"
                fill="none" stroke="currentColor"
                stroke-width="2.75" stroke-linecap="round" />
            </svg>
          </span>
          tools for<br />
          <span class="italic">regenerative intelligence</span>
        </h1>

        <p class="subtitle">
          Explore live nature projects around the world, back community-led restoration, and mint Bumicerts — verifiable proof-of-impact records signed on ATProto.
        </p>
      </div>

      <div class="footer-row">
        Built with rainforest communities &nbsp;·&nbsp; gainforest.app
      </div>
    </div>

    <div class="right">
      <div class="photo"></div>
      <div class="vignette"></div>
      <div class="feather"></div>
    </div>
  </div>
</body>
</html>
